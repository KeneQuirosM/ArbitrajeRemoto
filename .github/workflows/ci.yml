name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Same major version as new Supabase projects.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit, API and Postgres-layer tests
        run: npm test
      - name: API tests again, on Postgres
        run: npm test
        env:
          TEST_STORE: postgres
      - run: npm run build
      - name: Smoke test (curl examples against the local API on Postgres)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smoke
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c 'create database smoke'
          npm run db:migrate
          npm run db:migrate
          export ADMIN_PASSPHRASE_HASH="$(printf '%s' 'ci passphrase for smoke tests' | node scripts/hash-passphrase.ts)"
          export SESSION_SECRET="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")"
          DEV_STORE=postgres node scripts/dev-server.ts &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/api/v1/health >/dev/null && break; sleep 1; done
          PASSPHRASE='ci passphrase for smoke tests' bash examples/curl.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
